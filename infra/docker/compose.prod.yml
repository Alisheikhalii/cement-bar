# Production stack for cement-bar.
#
#   cd infra/docker
#   cp ../../.env.example .env.prod   # or: ../scripts/gen-secrets.sh > .env.prod
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
#
# Prefer infra/scripts/deploy.sh which also handles image tarballs + smoke tests.
#
# Variables used for interpolation (must be in the --env-file):
#   TAG, DOMAIN, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, REDIS_PASSWORD
# Optional: IMAGE_PREFIX (default ghcr.io/alisheikhalii), BACKUP_HOST_DIR, CERTBOT_EMAIL
# The api/worker containers additionally read the whole .env.prod (env_file).
name: cement-bar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-common: &api-common
  image: ${IMAGE_PREFIX:-ghcr.io/alisheikhalii}/cement-bar-api:${TAG:?TAG is required}
  env_file:
    - .env.prod
  read_only: true
  tmpfs:
    - /tmp:size=64m
  volumes:
    - uploads:/app/uploads
  networks: [internal]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Password read from env inside the container (not on the command line of `docker inspect` args).
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 200mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  api:
    <<: *api-common
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "1"
      WORKER: "0"
      API_PORT: "4000"
      UPLOAD_DIR: /app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768m

  worker:
    <<: *api-common
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "0"
      WORKER: "1"
      UPLOAD_DIR: /app/uploads
    # The worker does not serve HTTP (see DECISIONS open question); rely on restart policy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # api applies migrations first
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/alisheikhalii}/cement-bar-web:${TAG:?TAG is required}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/apps/web/.next/cache:size=128m,mode=1777
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      NGINX_ENVSUBST_TEMPLATE_DIR: /tmp/nginx-templates
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    entrypoint: ["/bin/sh", "/opt/cb/nginx-start.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/templates:/opt/cb/templates:ro
      - ../nginx/nginx-start.sh:/opt/cb/nginx-start.sh:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped
    logging: *logging

  certbot:
    image: certbot/certbot:v3.0.1
    # Renewal loop. First issuance: see README (Deployment) / deploy.sh --init-cert.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped
    logging: *logging

  # Optional daily backup loop:  docker compose --profile backup up -d backup
  # (alternative: host cron calling infra/scripts/backup.sh)
  backup:
    image: postgres:16-bookworm
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_DIR: /backups
      UPLOADS_SRC: /uploads
      BACKUP_RETENTION_DAYS: "14"
      TZ: UTC
    entrypoint: ["/bin/bash", "-c", "trap exit TERM; while :; do bash /opt/cb/backup.sh || echo 'backup FAILED' >&2; sleep 24h & wait $${!}; done"]
    volumes:
      - ../scripts/backup.sh:/opt/cb/backup.sh:ro
      - ${BACKUP_HOST_DIR:-/var/backups/cement-bar}:/backups
      - uploads:/uploads:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    logging: *logging

networks:
  # No outbound internet and no published ports for db/redis/api/web.
  internal:
    internal: true
  edge: {}

volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
  certbot-www: {}
  letsencrypt: {}
