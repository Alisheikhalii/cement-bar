# Security headers. Included in the HTTPS server AND in every location that has
# its own add_header (nginx does not inherit add_header into such locations).
# CSP is intentionally NOT set here: the app (helmet / Next middleware) owns it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Request-Id $request_id always;
