# Common upstream proxy settings.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Always generated by nginx (client-supplied ids are not trusted).
proxy_set_header X-Request-Id      $request_id;
# Keep-alive to upstream (empty Connection) unless the client asks for an upgrade.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# Timeouts are set at server level (and overridden for SSE).
