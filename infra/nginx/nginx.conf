# Main nginx config for cement-bar (mounted at /etc/nginx/nginx.conf).
# Server blocks are rendered from templates/ into /etc/nginx/conf.d/ by the
# official image's envsubst step (see nginx-start.sh).
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 30s;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  log_format main '$remote_addr - $remote_user [$time_iso8601] "$request" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rid=$request_id rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout main;

  # --- compression (SSE is text/event-stream and intentionally not listed) ----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/manifest+json application/xml image/svg+xml font/ttf;

  # --- rate limiting (per client IP) -----------------------------------------
  limit_req_zone $binary_remote_addr zone=general:20m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # --- proxy defaults ----------------------------------------------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream cb_api {
    server api:4000;
    keepalive 32;
  }
  upstream cb_web {
    server web:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
