name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'
  TZ: UTC

jobs:
  lint-type-test:
    name: lint · typecheck · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cb/api db:generate
      - run: pnpm exec turbo run build --filter=@cb/shared --filter=@cb/engine
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: integration (postgres + redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cb
          POSTGRES_PASSWORD: ci_only_not_secret
          POSTGRES_DB: cement_bar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cb -d cement_bar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cb:ci_only_not_secret@localhost:5432/cement_bar_test?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      UPLOAD_DIR: ${{ github.workspace }}/.tmp-uploads
      BUSINESS_TIMEZONE: Asia/Tehran
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Generate throwaway secrets (never stored)
        run: |
          set -euo pipefail
          for k in JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
            v="$(openssl rand -base64 48 | tr -d '\n')"; echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done
          for k in FIELD_ENCRYPTION_KEY FIELD_HASH_KEY; do
            v="$(openssl rand -base64 32 | tr -d '\n')"; echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done
          mkdir -p "$UPLOAD_DIR"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cb/api db:generate
      - run: pnpm exec turbo run build --filter=@cb/shared --filter=@cb/engine
      - name: Apply migrations
        run: pnpm --filter @cb/api exec prisma migrate deploy
      - run: pnpm test:int

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security:
    name: security (audit · gitleaks · osv)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (prod deps, high+)
        run: pnpm audit --prod --audit-level high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: osv-scanner (pnpm-lock.yaml)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile=pnpm-lock.yaml
