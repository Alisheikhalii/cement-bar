packages:
  - apps/*
  - packages/*
# pnpm 11: explicit build-script approvals (strictDepBuilds fails CI on anything unlisted)
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  "@swc/core": true
  msgpackr-extract: true
  sharp: true
  "@nestjs/core": false # postinstall is only a funding banner
# Security: force patched versions of transitive deps (same major only). See DECISIONS P1-4.
overrides:
  multer: ^2.5.0
  body-parser: ^1.20.9
  qs: ^6.16.1
  node-fetch: ^2.7.0
  bl: ^4.1.0
  fast-csv: ^4.3.6
  '@fast-csv/parse': ^4.3.6
  postcss: ^8.5.23
  sharp: ^0.35.5
  # dev-only tooling (vitest, @nestjs/cli)
  vite: ^5.4.21
  ansi-regex@4: ^4.1.1
  ansi-regex@5: ^5.0.1
  glob@10: ^10.5.0
  picomatch@4: ^4.0.4
  tmp: ^0.2.6
  webpack@5: ^5.104.1
  ajv@8: ^8.18.0
